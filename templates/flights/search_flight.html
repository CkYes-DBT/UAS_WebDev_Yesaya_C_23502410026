<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Flight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .search-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 20px;
        }
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 10px 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .icon-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="bi bi-airplane-fill"></i> SEARCH FLIGHT</h1>
        <div class="search-card">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label icon-label">
                        <i class="bi bi-geo-alt-fill text-primary"></i>
                        Departure City (IATA code)
                    </label>
                    <input type="text" class="form-control" name="origin" placeholder="Jakarta, CGK, Surabaya, dll." value="CGK" required>
                    <small class="text-muted">Ketik nama kota atau kode IATA (contoh: Jakarta atau CGK)</small>
                </div>

                <div class="mb-3">
                    <label class="form-label icon-label">
                        <i class="bi bi-geo-fill text-danger"></i>
                        Arrival City (IATA code)
                    </label>
                    <input type="text" class="form-control" name="destination" placeholder="Bangkok, Bali, BKK, DPS, dll." required>
                    <small class="text-muted">Ketik nama kota atau kode IATA (contoh: Bangkok atau BKK)</small>
                </div>

                <div class="mb-3">
                    <label class="form-label icon-label">
                        <i class="bi bi-calendar-check text-success"></i>
                        Departure Date
                    </label>
                    <input type="date" class="form-control" name="departure_date" min="{{ today }}" required>
                    <small class="text-muted">Pilih tanggal mulai hari ini atau sesudahnya</small>
                </div>

                <div class="mb-3">
                    <label class="form-label icon-label">
                        <i class="bi bi-arrow-left-right text-info"></i>
                        Trip Type
                    </label>
                    <select class="form-select" name="trip_type" id="trip_type">
                        <option value="one-way">One-way</option>
                        <option value="round-trip">Round trip</option>
                    </select>
                </div>

                <div id="return_date_wrapper" style="display:none;">
                    <div class="mb-3">
                        <label class="form-label icon-label">
                            <i class="bi bi-calendar-check text-warning"></i>
                            Return Date
                        </label>
                        <input type="date" class="form-control" name="return_date">
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-search">
                        <i class="bi bi-search"></i> Search Flights
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const tripType = document.getElementById('trip_type');
        const returnWrapper = document.getElementById('return_date_wrapper');

        function toggleReturn() {
            if (tripType.value === 'round-trip') {
                returnWrapper.style.display = 'block';
            } else {
                returnWrapper.style.display = 'none';
            }
        }

        tripType.addEventListener('change', toggleReturn);
        toggleReturn();
    </script>
</body>
</html>
