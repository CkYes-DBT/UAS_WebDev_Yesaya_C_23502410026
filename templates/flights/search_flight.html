<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Flight</title>
</head>
<body>
    <h1>Search Flight</h1>
    <form method="post">
        {% csrf_token %}

        <label>
            Destination city:
            <input type="text" name="destination" required>
        </label>
        <br><br>

        <label>
            Departure date:
            <input type="date" name="departure_date" required>
        </label>
        <br><br>

        <label>
            Trip type:
            <select name="trip_type" id="trip_type">
                <option value="one-way">One-way</option>
                <option value="round-trip">Round trip</option>
            </select>
        </label>
        <br><br>

        <div id="return_date_wrapper" style="display:none;">
            <label>
                Return date:
                <input type="date" name="return_date">
            </label>
            <br><br>
        </div>

        <button type="submit">Search</button>
    </form>

    <script>
        const tripType = document.getElementById('trip_type');
        const returnWrapper = document.getElementById('return_date_wrapper');

        function toggleReturn() {
            if (tripType.value === 'round-trip') {
                returnWrapper.style.display = 'block';
            } else {
                returnWrapper.style.display = 'none';
            }
        }

        tripType.addEventListener('change', toggleReturn);
        toggleReturn();
    </script>
</body>
</html>
